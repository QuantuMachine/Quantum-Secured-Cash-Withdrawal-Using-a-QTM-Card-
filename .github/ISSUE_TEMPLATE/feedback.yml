name: Feedback / Comment
description: Submit feedback, questions, suggestions, or collaboration ideas
title: "[Feedback]: "
labels: ["feedback"]

body:
  - type: input
    id: name
    attributes:
      label: Full Name
      description: Please enter your full name.
      placeholder: Your name
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: Email Address
      description: Optional. Add your email only if you want a direct response. Please remember that GitHub Issues are public.
      placeholder: your.email@example.com
    validations:
      required: false

  - type: dropdown
    id: feedback_type
    attributes:
      label: Feedback Type
      description: Select the type of feedback.
      options:
        - Question
        - Suggestion
        - Bug Report
        - Course Feedback
        - Collaboration
        - Documentation Correction
        - Other
    validations:
      required: true

  - type: textarea
    id: message
    attributes:
      label: Message / Comment
      description: Write your comment, suggestion, question, or feedback here.
      placeholder: Please describe your feedback clearly.
    validations:
      required: true

  - type: checkboxes
    id: public_notice
    attributes:
      label: Public Information Notice
      description: GitHub Issues are public. Do not share private information such as phone numbers, passwords, or sensitive personal details.
      options:
        - label: I understand that this issue will be publicly visible.
          required: true
